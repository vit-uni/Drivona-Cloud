        <div class="layui-card">
            <div class="layui-card-body">

            </div>
        </div>

        <!-- 테이블 상단 툴바 -->
        <script type="text/html" id="table-toolbar">
            <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="app.admin.admin.insert">
                <i class="layui-icon layui-icon-add-1"></i>추가
            </button>
            <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove" permission="app.admin.admin.delete">
                <i class="layui-icon layui-icon-delete"></i>삭제
            </button>
        </script>

        <!-- 테이블 행 툴바 -->
        <script type="text/html" id="table-bar">
            {{# if(d.show_toolbar){ }}
            <button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="app.admin.admin.update">편집</button>
            <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.admin.delete">삭제</button>
            {{# } }}
        </script>

        <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
        <script src="/app/admin/component/pear/pear.js"></script>
        <script src="/app/admin/admin/js/permission.js"></script>
        <script src="/app/admin/admin/js/common.js"></script>
        <script>

            // 관련 상수
            const PRIMARY_KEY = "id";
            const SELECT_API = "/app/admin/admin/select";
            const UPDATE_API = "/app/admin/admin/update";
            const DELETE_API = "/app/admin/admin/delete";
            const INSERT_URL = "/app/admin/admin/insert";
            const UPDATE_URL = "/app/admin/admin/update";
            
            // 필드 생성 시간 created_at
            layui.use(["laydate"], function() {
                layui.laydate.render({
                    elem: "#created_at",
                    range: ["#created_at-date-start", "#created_at-date-end"],
                });
            })
            
            // 테이블 렌더링
            layui.use(["table", "form", "common", "popup", "util"], function() {
                let table = layui.table;
                let form = layui.form;
                let $ = layui.$;
                let common = layui.common;
                let util = layui.util;
                
                // 테이블 헤더 파라미터
                let cols = [
                    {
                        type: "checkbox"
                    },{
                        title: "ID",
                        field: "id",
                        width: 100,
                        sort: true,
                        type:'numbers'
                    },{
                        title: "사용자명",
                        field: "username",
                    },{
                        title: "닉네임",
                        field: "nickname",
                    },{
                        title: "프로필 이미지",
                        field: "avatar",
                        templet: function (d) {
                            return '<img src="'+encodeURI(d['avatar'])+'" style="max-width:32px;max-height:32px;" alt="" />'
                        },
                        width: 90,
                    },{
                        title: "생성 시간",
                        field: "created_at",
                        hide: true,
                    },{
                        title: "역할",
                        field: "roles",
                        templet: function (d) {
                            let field = "roles";
                            if (typeof d[field] == "undefined") return "";
                            let items = [];
                            layui.each((d[field] + "").split(","), function (k , v) {
                                items.push(apiResults[field][v] || v);
                            });
                            return util.escape(items.join(","));
                        }
                    },{
                        title: "상태",
                        field: "status_view",
                        templet: function (d) {
                            if(d.status==1)return '비활성화';
                            return '';
                        }
                        
                    },{
                        title: "비활성화",
                        field: "status",
                        templet: function (d) {
                            let field = "status";
                            form.on("switch("+field+")", function (data) {
                                let load = layer.load();
                                let postData = {};
                                postData[field] = data.elem.checked ? 1 : 0;
                                postData[PRIMARY_KEY] = this.value;
                                $.post(UPDATE_API, postData, function (res) {
                                    layer.close(load);
                                    if (res.code) {
                                        return layui.popup.failure(res.msg, function () {
                                            data.elem.checked = !data.elem.checked;
                                            form.render();
                                        });
                                    }
                                    location.reload();
                                    return layui.popup.success("작업 성공");
                                })
                            });
                            let checked = d[field] === 1 ? "checked" : "";
                            if (parent.Admin.Account.id === d.id) return '';
                            return '<input type="checkbox" value="'+util.escape(d[PRIMARY_KEY])+'" lay-filter="'+util.escape(field)+'" lay-skin="switch" lay-text="'+util.escape('활성화|비활성화')+'" '+checked+'/>';
                        },
                        width: 90,
                    },{
                        title: "작업",
                        toolbar: "#table-bar",
                        align: "center",
                        fixed: "right",
                        width: 130,
                    }
                ];
                
                // 테이블 렌더링
                function render()
                {
                    table.render({
                        elem: "#data-table",
                        url: SELECT_API,
                        page: true,
                        cols: [cols],
                        skin: "line",
                        size: "lg",
                        toolbar: "#table-toolbar",
                        autoSort: false,
                        defaultToolbar: [{
                            title: "새로고침",
                            layEvent: "refresh",
                            icon: "layui-icon-refresh",
                        }, "filter", "print", "exports"],
                        done: function () {
                            layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                        }
                    });
                }
                
                // 테이블 내 드롭다운 또는 트리 컴포넌트 데이터 가져오기
                let apis = [];
                apis.push(["roles", "/app/admin/role/select?format=select"]);
                let apiResults = {};
                apiResults["roles"] = [];
                let count = apis.length;
                layui.each(apis, function (k, item) {
                    let [field, url] = item;
                    $.ajax({
                        url: url,
                        dateType: "json",
                        success: function (res) {
                            if (res.code) {
                                return layui.popup.failure(res.msg);
                            }
                            function travel(items) {
                                for (let k in items) {
                                    let item = items[k];
                                    apiResults[field][item.value] = item.name;
                                    if (item.children) {
                                        travel(item.children);
                                    }
                                }
                            }
                            travel(res.data);
                        },
                        complete: function () {
                            if (--count === 0) {
                                render();
                            }
                        }
                    });
                });
                if (!count) {
                    render();
                }
                
                // 행 편집 또는 삭제 이벤트
                table.on("tool(data-table)", function(obj) {
                    if (obj.event === "remove") {
                        remove(obj);
                    } else if (obj.event === "edit") {
                        edit(obj);
                    }
                });

                // 테이블 상단 툴바 이벤트
                table.on("toolbar(data-table)", function(obj) {
                    if (obj.event === "add") {
                        add();
                    } else if (obj.event === "refresh") {
                        refreshTable();
                    } else if (obj.event === "batchRemove") {
                        batchRemove(obj);
                    }
                });

                // 테이블 상단 검색 이벤트
                form.on("submit(table-query)", function(data) {
                    table.reload("data-table", {
                        page: {
                            curr: 1
                        },
                        where: data.field
                    })
                    return false;
                });
                
                // 테이블 상단 검색 초기화 이벤트
                form.on("submit(table-reset)", function(data) {
                    table.reload("data-table", {
                        where: []
                    })
                });

                // 테이블 정렬 이벤트
                table.on("sort(data-table)", function(obj){
                    table.reload("data-table", {
                        initSort: obj,
                        scrollPos: "fixed",
                        where: {
                            field: obj.field,
                            order: obj.type
                        }
                    });
                });

                // 테이블 데이터 추가
                let add = function() {
                    layer.open({
                        type: 2,
                        title: "추가",
                        shade: 0.1,
                        area: [common.isModile()?"100%":"1000px", common.isModile()?"100%":"600px"],
                        content: INSERT_URL
                    });
                }

                // 테이블 데이터 편집
                let edit = function(obj) {
                    let value = obj.data[PRIMARY_KEY];
                    layer.open({
                        type: 2,
                        title: "수정",
                        shade: 0.1,
                        area: [common.isModile()?"100%":"1000px", common.isModile()?"100%":"600px"],
                        content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
                    });
                }

                // 한 행 삭제
                let remove = function(obj) {
                    return doRemove(obj.data[PRIMARY_KEY]);
                }

                // 여러 행 삭제
                let batchRemove = function(obj) {
                    let checkIds = common.checkField(obj, PRIMARY_KEY);
                    if (checkIds === "") {
                        layui.popup.warning("선택된 데이터가 없습니다");
                        return false;
                    }
                    doRemove(checkIds.split(","));
                }

                // 삭제 실행
                let doRemove = function (ids) {
                    let data = {};
                    data[PRIMARY_KEY] = ids;
                    layer.confirm("정말 삭제하시겠습니까?", {
                        icon: 3,
                        title: "안내"
                    }, function(index) {
                        layer.close(index);
                        let loading = layer.load();
                        $.ajax({
                            url: DELETE_API,
                            data: data,
                            dataType: "json",
                            type: "post",
                            success: function(res) {
                                layer.close(loading);
                                if (res.code) {
                                    return layui.popup.failure(res.msg);
                                }
                                return layui.popup.success("작업 성공", refreshTable);
                            }
                        })
                    });
                }

                // 테이블 데이터 새로고침
                window.refreshTable = function() {
                    table.reloadData("data-table", {
                        scrollPos: "fixed",
                        done: function (res, curr) {
                            if (curr > 1 && res.data && !res.data.length) {
                                curr = curr - 1;
                                table.reloadData("data-table", {
                                    page: {
                                        curr: curr
                                    },
                                })
                            }
                        }
                    });
                }
            })

        </script>
    </body>
</html>
