<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="UTF-8">
        <title>新增页面</title>
        <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
        <link rel="stylesheet" href="/app/admin/admin/css/reset.css" />
    </head>
    <body>

        <form class="layui-form" action="">

            <div class="mainBox">
                <div class="main-container mr-5">
                    
                    <!--<div class="layui-form-item">-->
                    <!--    <label class="layui-form-label required">用户名</label>-->
                    <!--    <div class="layui-input-block">-->
                    <!--        <input type="text" name="username" value="" required lay-verify="required" class="layui-input">-->
                    <!--    </div>-->
                    <!--</div>-->
                    
                    <div class="layui-form-item">
                        <label class="layui-form-label required"><?=admin_trans('文档名称')?></label>
                        <div class="layui-input-block">
                            <input type="text" name="title" value="" required lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    
                   
                    
                    <div class="layui-form-item">
                        <label class="layui-form-label"><?=admin_trans('文档')?></label>
                        <div class="layui-input-block">
                            <p id="view_url"></p>
                            <input type="text" style="display:none" name="url" value="" id="post_url"/>
                            <!--<button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="avatar" permission="app.admin.upload.insert">-->
                            <!--    <i class="layui-icon layui-icon-upload"></i>上传文档-->
                            <!--</button>-->
                            <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="attachment-choose-avatar" permission="app.admin.upload.attachment">
                                <i class="layui-icon layui-icon-align-left"></i><?=admin_trans('选择文档')?>
                            </button>
                        </div>
                    </div>
                    
                   
                    
                </div>
            </div>

            <div class="bottom">
                <div class="button-container">
                    <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit=""
                        lay-filter="save">
                        <?=admin_trans('提交')?>
                    </button>
                    <button type="reset" class="pear-btn pear-btn-md">
                        <?=admin_trans('重置')?>
                    </button>
                </div>
            </div>
            
        </form>

        <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
        <script src="/app/admin/component/pear/pear.js"></script>
        <script src="/app/admin/admin/js/permission.js"></script>
        <script>

            // 相关接口
            const INSERT_API = "/app/admin/regulations/insert";
            
            
            
            // 字段 头像 avatar
            layui.use(["upload", "layer"], function() {
                
                layui.$("#attachment-choose-avatar").on("click", function() {
                    parent.layer.open({
                        type: 2,
                        title: "<?=admin_trans('选择附件')?>",
                        content: "/app/admin/upload/attachment?ext=doc,docx,pdf",
                        area: ["95%", "90%"],
                        success: function (layero, index) {
                            parent.layui.$("#layui-layer" + index).data("callback", function (data) {
                           
                                layui.$('#view_url').html(data.name);
                                layui.$('#post_url').val(data.url);
                            });
                        }
                    });
                });
                layui.upload.render({
                    elem: "#avatar",
                    url: "/app/admin/upload/file",
                    accept:'file',
                    field: "__file__",
                    done: function (res) {
                        if (res.code > 0) return layui.layer.msg(res.msg);
                        layui.$('#view_url').html(res.data.url);
                    }
                });
                
                
            });
            

            
            //提交事件
            layui.use(["form", "popup"], function () {
                layui.form.on("submit(save)", function (data) {
                    layui.$.ajax({
                        url: INSERT_API,
                        type: "POST",
                        dateType: "json",
                        data: data.field,
                        success: function (res) {
                            if (res.code) {
                                return layui.popup.failure(res.msg);
                            }
                            return layui.popup.success("<?=admin_trans('操作成功')?>", function () {
                                parent.refreshTable();
                                parent.layer.close(parent.layer.getFrameIndex(window.name));
                            });
                        }
                    });
                    return false;
                });
            });

        </script>

    </body>
</html>
