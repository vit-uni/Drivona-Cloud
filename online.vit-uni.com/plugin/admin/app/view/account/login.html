<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <title data-i18n="登录">登录</title>
        <!-- 多 语 言 -->
        <script>
            window.__LANG_CODE__ = <?=json_encode($lang)?>;
            window.__LANG_DICT__ = <?=json_encode($lang_dict, JSON_UNESCAPED_UNICODE)?>;
        </script>
        <script src="/app/admin/lang/i18n.js"></script>
        <!-- 样 式 文 件 -->
        <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
        <link rel="stylesheet" href="/app/admin/admin/css/pages/login.css" />
        <style>
            .language-switch {
                position: absolute;
                top: 20px;
                right: 20px;
                z-index: 999;
            }
            .language-switch .lang-btn {
                background: #fff;
                border: 1px solid #ddd;
                padding: 5px 10px;
                cursor: pointer;
                border-radius: 4px;
                margin-left: 6px;
            }
            .language-switch .lang-btn.active {
                background: #2d8cf0;
                color: #fff;
                border-color: #2d8cf0;
            }
        </style>
    </head>
    <!-- 代 码 结 构 -->
    <body background="/app/admin/admin/images/background.svg" style="background-size: cover;">
        <div class="language-switch">
            <button type="button" class="lang-btn" data-lang="zh">中文</button>
            <button type="button" class="lang-btn" data-lang="en">English</button>
            <button type="button" class="lang-btn" data-lang="de">Deutsch</button>
        </div>

        <form class="layui-form">
            <div class="layui-form-item">
                <img class="logo" src="<?=$logo?>" />
                <div class="title pear-text"><?=$title?></div>
            </div>
            <div class="layui-form-item">
                <input lay-verify="required" hover class="layui-input" type="text" name="username" value=""
                    data-i18n-placeholder="用户名" placeholder="用户名" />
            </div>
            <div class="layui-form-item">
                <input lay-verify="required" hover class="layui-input" type="password" name="password" value=""
                    data-i18n-placeholder="密码" placeholder="密码" />
            </div>
            <div class="layui-form-item">
                <input hover lay-verify="required" class="code layui-input layui-input-inline" name="captcha"
                    data-i18n-placeholder="验证码" placeholder="验证码" />
                <img class="codeImage" width="120px"/>
            </div>
            <div class="layui-form-item">
                <button type="submit" class="pear-btn pear-btn-primary login" lay-submit lay-filter="login"
                    data-i18n="登 录">登 录</button>
            </div>
            <input type="hidden" value="<?=$lang?>" id="sub_lang" name="lang">
        </form>
        <script>
            var color = localStorage.getItem("theme-color-color");
            var second = localStorage.getItem("theme-color-second");
            if (!color || !second) {
                localStorage.setItem("theme-color-color", "#2d8cf0");
                localStorage.setItem("theme-color-second", "#ecf5ff");
            }
        </script>
        <!-- 资 源 引 入 -->
        <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
        <script src="/app/admin/component/pear/pear.js"></script>
        <script>
            layui.use(['form', 'button', 'popup', 'layer', 'theme', 'admin'], function() {
                var $ = layui.$, layer = layui.layer, form = layui.form;

                // 语言选择
                var currentLang = window.__LANG_CODE__ || 'zh';
                $('#sub_lang').val(currentLang);
                $('.lang-btn[data-lang="' + currentLang + '"]').addClass('active');
                window.__i18n.applyI18n();

                $('.lang-btn').on('click', function () {
                    var lang = $(this).data('lang');
                    location.href = '?lang=' + lang;
                });

                // 验证码刷新
                function switchCaptcha() {
                    $('.codeImage').attr("src", "/app/admin/account/captcha/login?v=" + new Date().getTime());
                }
                switchCaptcha();

                // 登 录 提 交
                form.on('submit(login)', function (data) {
                    layer.load();
                    $.ajax({
                        url: '/app/admin/account/login',
                        type: "POST",
                        data: data.field,
                        success: function (res) {
                            layer.closeAll('loading');
                            if (!res.code) {
                                layui.popup.success(window.t('登录成功'), function () {
                                    location.reload();
                                })
                            } else {
                                layui.popup.failure(window.t(res.msg) || res.msg)
                                switchCaptcha();
                            }
                        }
                    });
                    return false;
                });

                $('.codeImage').on('click', function () {
                    switchCaptcha();
                });
            })
        </script>
    </body>
</html>
